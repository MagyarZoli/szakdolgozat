# Minden push és pull request után lefordítja a projektet és lefuttatja a teszteket.
name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Fordítás és tesztek
        run: mvn -B package
