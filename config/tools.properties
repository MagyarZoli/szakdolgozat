# Eszközbeállítások (közös alapértékek, a repóban vannak).
# A saját gépedre vonatkozó útvonalakat a config/tools.local.properties fájlba írd
# (gitignore-olt), vagy környezeti változóba: pont helyett aláhúzás, nagybetű, CG_ előtag
# (pl. osa.home -> CG_OSA_HOME).

# --- OpenStaticAnalyzer ---------------------------------------------------
# Az OSA telepítési könyvtára (amelyben a Java/ alkönyvtár van).
osa.home=

# A futtatott parancs sablonja. Változók: ${osa.home}, ${project}, ${input}, ${workDir}.
# Az OSA kapcsolóit itt lehet a telepített verzióhoz igazítani; a gráfhoz a külső
# ellenőrzők (FindBugs/SpotBugs, PMD, duplikációkeresés) nem kellenek, ezért ki vannak kapcsolva.
osa.command=${osa.home}/Java/AnalyzerJava -projectName=${project} -projectBaseDir=${input} -resultsDir=${workDir} -currentDate=run -runFB=false -runPMD=false -runDCF=false -runMetricHunter=false

# Percben; nagy projekteknél növelni kell.
osa.timeoutMinutes=120

# true: ha a munkakönyvtárban már van *-Method.csv, nem futtatja újra az OSA-t.
osa.reuseResults=false

# A hívási élek forrása: none | csv
#   csv: a munkakönyvtárban egy caller,callee[,line] oszlopú CSV (LongName alakban), lásd osa.calls.file
#   none: csak a csúcsok készülnek el (figyelmeztetéssel)
osa.calls.source=none
osa.calls.file=*-Calls.csv
